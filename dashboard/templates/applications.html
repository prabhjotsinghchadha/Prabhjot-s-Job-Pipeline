{% extends "base.html" %}
{% block content %}
<div x-data="applications()" x-init="init()">
  <div class="page-head">
    <h1>Applications</h1>
    <span class="muted" x-text="total ? total + ' tracked' : ''"></span>
    <span class="spacer"></span>
    <button class="btn sm" @click="checkEmail()" :disabled="checking" title="Read your inbox for rejections and interview invites">
      <span class="spin" x-show="checking" x-cloak></span> Check email for updates
    </button>
  </div>

  <div class="card" x-show="followUps.overdue.length || followUps.ghosts.length" x-cloak style="border-color: var(--weak)">
    <div class="card-head"><h2>Needs attention</h2></div>
    <template x-for="j in followUps.overdue" :key="'o' + j.id">
      <div class="row small" style="margin-bottom:.4rem">
        <span><strong x-text="j.title"></strong> at <span x-text="j.company"></span> — follow-up was due <span x-text="fmt.date(j.follow_up_date)"></span></span>
        <span class="spacer"></span>
        <button class="btn sm" @click="followedUp(j)">Followed up, remind in 7d</button>
        <button class="btn sm link" @click="dismissFollowUp(j)">Dismiss</button>
      </div>
    </template>
    <template x-for="j in followUps.ghosts" :key="'g' + j.id">
      <div class="row small" style="margin-bottom:.4rem">
        <span><strong x-text="j.title"></strong> at <span x-text="j.company"></span> — no reply in 14+ days</span>
        <span class="spacer"></span>
        <button class="btn sm" @click="setStatus(j, 'rejected')">Mark rejected</button>
        <button class="btn sm link" @click="setStatus(j, 'archived')">Archive</button>
      </div>
    </template>
  </div>

  <div class="tabs">
    <template x-for="s in stages" :key="s">
      <button :class="{active: tab===s}" @click="tab=s" x-text="label(s) + ' ' + (groups[s] || []).length"></button>
    </template>
  </div>

  <div class="empty" x-show="!loading && !(groups[tab] || []).length" x-cloak>
    <h2 x-text="tab === 'applied' ? 'No applications yet' : 'Nothing here'"></h2>
    <p x-show="tab === 'applied'">Apply to something from the <a href="/">Inbox</a> and it shows up here.</p>
  </div>

  <template x-for="job in (groups[tab] || [])" :key="job.id">
    <div class="card">
      <div class="job">
        <div class="score" :class="fmt.scoreClass(job.match_score)" x-text="job.match_score ?? '–'"></div>
        <div>
          <a class="title" :href="job.apply_url || job.url" target="_blank" rel="noopener" x-text="job.title"></a>
          <div class="meta">
            <span x-text="job.company"></span>
            <span x-show="job.location"> · <span x-text="job.location"></span></span>
            <span x-show="job.applied_at"> · applied <span x-text="fmt.date(job.applied_at)"></span></span>
            <span x-show="job.follow_up_date && tab==='applied'"> · follow up <span x-text="fmt.date(job.follow_up_date)"></span></span>
          </div>
          <div class="small" style="margin-top:.4rem">
            <button class="btn link sm" @click="job._notes = !job._notes" x-text="job._notes ? 'Hide notes' : (job.notes ? 'Notes' : 'Add note')"></button>
            <textarea x-show="job._notes" x-cloak x-model="job.notes" @blur="saveNotes(job)" placeholder="Recruiter name, interview dates, what they asked…" style="margin-top:.4rem"></textarea>
            <div class="tiny muted" x-show="!job._notes && job.notes" x-text="job.notes.split('\n').slice(-1)[0]"></div>
          </div>
        </div>
        <div class="actions">
          <template x-for="s in nextStages(job.status)" :key="s">
            <button class="btn sm" :class="{primary: s==='interviewing' || s==='offer'}" @click="setStatus(job, s)" x-text="'→ ' + label(s)"></button>
          </template>
        </div>
      </div>
    </div>
  </template>
</div>
{% endblock %}
