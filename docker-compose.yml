services:
  mrjobs:
    build: .
    ports:
      # Loopback only — dashboard has no auth; tunnels (VS Code, ngrok) still work
      - "127.0.0.1:8080:8080"
    volumes:
      - ./profile.yaml:/app/profile.yaml
      - ./resumes:/app/resumes
      - ./applications.db:/app/applications.db
      - ./.cache:/app/.cache
    environment:
      # The `claude` CLI reads these; set exactly one.
      # ANTHROPIC_API_KEY   — console.anthropic.com key (sk-ant-api03-...), per-token billing
      # CLAUDE_CODE_OAUTH_TOKEN — from `claude setup-token`, uses a Pro/Max subscription
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      # Optional HTTP Basic auth for the dashboard. Blank = no auth (local).
      # Required when hosting anywhere reachable from outside this machine.
      - DASHBOARD_USER=${DASHBOARD_USER:-admin}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-}
    restart: unless-stopped
