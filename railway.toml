# Railway deployment config — https://docs.railway.com/reference/config-as-code
#
# Required service setup (dashboard or CLI, not expressible in this file):
#   - Volume mounted at /data
#   - Variables: DATA_DIR=/data, DASHBOARD_PASSWORD=<yours>,
#     ANTHROPIC_API_KEY=<key> (or CLAUDE_CODE_OAUTH_TOKEN)
# See DEPLOY_RAILWAY.md for the full walkthrough.

[build]
builder = "dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5
